# =============================================================
#  Sincronizador Aterro - Quebec Ambiental
#  Edite este arquivo para configurar a sincronização.
# =============================================================

# Ativar (true) ou Desativar (false) o sincronizador
enabled: true

# -----------------------------------------------------------
# Variáveis de Negócio
# -----------------------------------------------------------

# Código do centro de custo / projeto gravado no campo NJH_XCLVL.
# Se preenchido aqui, sobrescreve o valor que vier do banco de origem.
# Deixe em branco ("") para usar o valor já existente no registro de origem.
njh_xclvl: ""

# -----------------------------------------------------------
# API de Produção (destino da sincronização)
# -----------------------------------------------------------
api:
  base_url: "http://177.136.201.210:8086/rest"
  tenant_id: "01"
  username: "eopera"
  password: "eopera@213"
  timeout_seconds: 30

# -----------------------------------------------------------
# Banco de Dados de Origem (ambiente fonte dos dados)
# -----------------------------------------------------------
source_db:

  # Tipo do banco: sqlserver | postgres | mysql
  type: "postgres"

  # Empresa e Filial Protheus (filtro de registros e sufixo das tabelas)
  # Convenção: tabela NJH empresa "01" → NJH010
  empresa: "01"
  filial: "01  "    # preencha com espaços à direita se necessário (padrão Protheus)
  clvl: "0102"

  # Casing do nome das tabelas no banco:
  #   upper → NJH010   (SQL Server / padrão Protheus)
  #   lower → njh010   (alguns ambientes PostgreSQL)
  table_case: "upper"

  # ----------------------------------------------------------
  # SQL Server
  # ----------------------------------------------------------
  sqlserver:
    driver: "ODBC Driver 17 for SQL Server"   # ou "SQL Server"
    server: "SERVIDOR\\INSTANCIA"
    database: "NOME_DO_BANCO"
    username: "usuario_db"
    password: "senha_db"
    trusted_connection: false   # true = Windows Auth (ignora usuario/senha)

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  postgres:
    host: "localhost"
    port: 5432
    database: "aterro"
    username: "postgres"
    password: "postgres"
    # sslmode: "require"   # descomente se necessário

  # ----------------------------------------------------------
  # MySQL / MariaDB
  # ----------------------------------------------------------
  mysql:
    host: "localhost"
    port: 3306
    database: "nome_do_banco"
    username: "root"
    password: "senha_db"
    charset: "utf8mb4"

# -----------------------------------------------------------
# Parâmetros de Sincronização
# -----------------------------------------------------------
sync:
  interval_seconds: 300      # Intervalo entre ciclos em segundos (300 = 5 min)
  batch_size: 50             # Quantidade máxima de registros processados por ciclo
  retry_attempts: 3          # Tentativas em caso de falha na API
  retry_delay_seconds: 10    # Segundos de espera entre tentativas

  # Por quantos dias, após a sincronização, um registro NJH continua sendo
  # reverificado em busca de alterações (ex.: mudança de status, correção de
  # peso/observação feita na tela do sincronizador ou direto no Protheus).
  # Alterações detectadas são replicadas em produção via updMovNJH.
  recheck_days: 30

  # Arquivo SQLite (na mesma pasta deste config.yaml) onde o sincronizador
  # guarda o hash do último envio de cada registro, usado para detectar
  # alterações pós-sincronização. Não precisa editar manualmente.
  state_db_filename: "sync_state.sqlite"

# -----------------------------------------------------------
# Log
# -----------------------------------------------------------
log:
  level: "INFO"              # DEBUG | INFO | WARNING | ERROR
  directory: "logs"
  filename: "sync_aterro.log"
  max_bytes: 10485760        # Tamanho máximo do arquivo de log (10 MB)
  backup_count: 5            # Número de arquivos de backup rotacionados
