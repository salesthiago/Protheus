<div class="item-grid-scroll">
  <po-table [p-columns]="colunas" [p-items]="linhas" [p-actions]="acoes" [p-striped]="true"></po-table>
</div>

<div class="item-grid-adicionar" *ngIf="!somenteLeitura">
  <po-button p-label="+ Adicionar item" p-kind="secondary" (p-click)="adicionarItem()"></po-button>
</div>

<!-- Modal "Item" (layout da tela nativa): Produto/Servico + Valor total do item, Valor unitario,
     Quantidade, Desconto, e TES (acrescentada a pedido). Rateio contabil reduzido a UM centro de custo. -->
<po-modal
  #modalItem
  p-title="Item"
  p-size="lg"
  [p-primary-action]="acaoConfirmar"
  [p-secondary-action]="acaoCancelar">
  <div class="po-row">
    <po-lookup
      class="po-md-8"
      name="itemProduto"
      p-label="Produto / Serviço"
      p-field-value="codigo"
      p-field-label="descricao"
      [p-columns]="produtoColumns"
      [p-filter-service]="produtoFilter"
      [(ngModel)]="itemEmEdicao.produto"
      [p-required]="true"
      (p-selected)="onProdutoSelecionado($event)">
    </po-lookup>
    <div class="po-md-4 item-grid-total">
      <span class="item-grid-total-rotulo">Valor total do item</span>
      <span class="item-grid-total-valor">{{ valorTotalEmEdicao }}</span>
    </div>
  </div>

  <div class="po-row">
    <div class="po-md-4">
      <po-decimal
        p-label="Valor unitário"
        name="itemValorUnitario"
        [p-decimals-length]="casasDecimais"
        [(ngModel)]="itemEmEdicao.valorUnitario">
      </po-decimal>
    </div>
    <div class="po-md-4">
      <po-number p-label="Quantidade" name="itemQuantidade" [(ngModel)]="itemEmEdicao.quantidade"></po-number>
    </div>
    <div class="po-md-4">
      <po-number p-label="Desconto (%)" name="itemDesconto" [(ngModel)]="itemEmEdicao.desconto"></po-number>
    </div>
  </div>

  <div class="po-row">
    <po-lookup
      class="po-md-6"
      name="itemTes"
      p-label="TES"
      p-field-value="codigo"
      p-field-label="descricao"
      [p-columns]="tesColumns"
      [p-filter-service]="tesFilter"
      [(ngModel)]="itemEmEdicao.tes"
      (p-selected)="onTesSelecionado($event)">
    </po-lookup>
  </div>

  <h4 class="item-grid-secao">Rateio contábil</h4>
  <div class="po-row">
    <po-lookup
      class="po-md-6"
      name="itemCc"
      p-label="Centro de custo"
      p-field-value="codigo"
      p-field-label="descricao"
      [p-columns]="ccColumns"
      [p-filter-service]="ccFilter"
      [(ngModel)]="itemEmEdicao.cc"
      (p-selected)="onCcSelecionado($event)">
    </po-lookup>
  </div>
</po-modal>
