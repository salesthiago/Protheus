<po-page-list p-title="Contratos" [p-filter]="filtroPagina">
  <div class="rtm003-header-acoes">
    <po-dropdown p-label="Incluir" [p-actions]="acoesIncluir"></po-dropdown>
  </div>

  <po-table
    [p-columns]="colunas"
    [p-items]="contratos"
    [p-loading]="carregando"
    [p-striped]="true"
    [p-selectable]="true"
    (p-selected)="abrirContrato($event)">
  </po-table>
</po-page-list>

<po-modal #modalBuscaAvancada p-title="Busca Avançada" p-size="md">
  <div class="po-row">
    <div class="po-md-6">
      <po-select
        p-label="Tipo"
        [p-options]="tipoOptions"
        name="filtroTipo"
        [ngModel]="filtroTipo"
        (ngModelChange)="filtroTipo = $event">
      </po-select>
    </div>
    <div class="po-md-6">
      <po-select
        p-label="Situação"
        [p-options]="situacaoOptions"
        name="filtroSituacao"
        [ngModel]="filtroSituacao"
        (ngModelChange)="filtroSituacao = $event">
      </po-select>
    </div>
  </div>
  <div class="po-row">
    <div class="po-md-4">
      <po-select
        p-label="Filial"
        [p-options]="filiaisFiltroOptions"
        name="filtroFilial"
        [ngModel]="filtroFilial"
        (ngModelChange)="filtroFilial = $event">
      </po-select>
    </div>
    <div class="po-md-4">
      <po-datepicker p-label="Data Início (de)" name="filtroDataInicioDe" [(ngModel)]="filtroDataInicioDe"></po-datepicker>
    </div>
    <div class="po-md-4">
      <po-datepicker p-label="Data Início (até)" name="filtroDataInicioAte" [(ngModel)]="filtroDataInicioAte"></po-datepicker>
    </div>
  </div>

  <div class="rtm003-modal-acoes">
    <po-button p-label="Limpar" p-kind="secondary" (p-click)="limparBuscaAvancada()"></po-button>
    <po-button p-label="Aplicar" p-kind="primary" (p-click)="aplicarBuscaAvancada()"></po-button>
  </div>
</po-modal>

<po-modal #modalSelecaoFilial p-title="Selecione a Filial" p-size="sm">
  <po-select
    p-label="Filial do Contrato"
    p-help="O contrato será criado na filial escolhida abaixo."
    [p-options]="filiaisOptions"
    name="filialParaIncluir"
    [ngModel]="filialParaIncluir"
    (ngModelChange)="filialParaIncluir = $event">
  </po-select>

  <div class="rtm003-modal-acoes">
    <po-button p-label="Confirmar" p-kind="primary" (p-click)="confirmarInclusao()"></po-button>
  </div>
</po-modal>
