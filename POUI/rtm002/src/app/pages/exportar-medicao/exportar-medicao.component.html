<po-page-list p-title="Exportação de Contrato">
  <p>Informe o contrato para selecionar as planilhas a exportar.</p>

  <div class="po-row">
    <div class="po-md-3">
      <po-input p-label="Contrato" name="numContrato" [(ngModel)]="numContrato" (keyup.enter)="buscarContrato()"></po-input>
    </div>
    <div class="po-md-3">
      <po-input p-label="Revisão" name="revisao" [(ngModel)]="revisao" (keyup.enter)="buscarContrato()"></po-input>
    </div>
    <div class="po-md-3 rtm002-buscar-btn">
      <po-button p-label="Buscar" p-kind="primary" [p-loading]="buscando" (p-click)="buscarContrato()"></po-button>
    </div>
    <div class="po-md-3" *ngIf="contratoCarregado">
      <div class="rtm002-limpar">
        <po-button p-label="Limpar" p-kind="link" [p-icon]="iconClear" (p-click)="limpar()"></po-button>
      </div>
    </div>
  </div>

  <div class="rtm002-info-box" *ngIf="contratoCarregado">
    <po-icon [p-icon]="iconInfo" class="rtm002-info-icon"></po-icon>

    <po-info class="rtm002-info-item" p-label="Contrato" [p-value]="numContrato + ' / ' + revisao"></po-info>

    <po-info
      *ngIf="pessoaOptions.length <= 1"
      class="rtm002-info-item"
      [p-label]="labelPessoa"
      [p-value]="pessoaOptions[0]?.label ?? '-'">
    </po-info>

    <po-select
      *ngIf="pessoaOptions.length > 1"
      class="rtm002-info-item"
      [p-label]="labelPessoa"
      p-placeholder="Todos"
      [p-options]="pessoaOptions"
      name="pessoaSelecionada"
      [ngModel]="pessoaSelecionada"
      (ngModelChange)="onPessoaAlterada($event)">
    </po-select>
  </div>

  <!-- Checkboxes de opções de exportação ficam ACIMA da tabela de planilhas, e não depois
       dela: com o rodapé fixo (.rtm002-footer) cobrindo a parte de baixo da tela, qualquer
       controle colocado após uma po-table de altura variável corre o risco de ficar
       escondido/inacessível (visto na prática: o checkbox só aparecia como uma tira de poucos
       pixels acima do rodapé). Aqui ficam sempre visíveis, sem depender de scroll. -->
  <div class="po-row" *ngIf="contratoCarregado">
    <div class="po-md-6">
      <po-checkbox
        p-label="Incluir cronograma financeiro (aba separada no arquivo exportado)"
        name="incluirCronograma"
        [(ngModel)]="incluirCronograma"
        (ngModelChange)="onIncluirCronogramaAlterado()">
      </po-checkbox>
    </div>
    <div class="po-md-6">
      <po-checkbox
        p-label="Incluir última medição de cada planilha (aba separada no arquivo exportado)"
        name="incluirUltimaMedicao"
        [(ngModel)]="incluirUltimaMedicao">
      </po-checkbox>
    </div>
  </div>

  <div class="rtm002-table-scroll" *ngIf="contratoCarregado">
    <po-table
      #tabelaPlanilhas
      p-title="Planilhas do contrato"
      [p-columns]="planilhaColumns"
      [p-items]="planilhas"
      [p-loading]="carregandoPlanilhas"
      [p-selectable]="true"
      [p-height]="300"
      [p-striped]="true"
      (p-selected)="onSelecaoPlanilhaAlterada()"
      (p-unselected)="onSelecaoPlanilhaAlterada()"
      (p-all-selected)="onSelecaoPlanilhaAlterada()"
      (p-all-unselected)="onSelecaoPlanilhaAlterada()">
    </po-table>

    <div class="rtm002-cronograma" *ngIf="incluirCronograma">
      <p class="rtm002-cronograma-titulo">Cronograma financeiro</p>

      <po-table
        *ngIf="cronograma.length > 0"
        p-title="Parcelas previstas (planilhas marcadas acima)"
        [p-columns]="cronogramaColumns"
        [p-items]="cronograma"
        [p-loading]="carregandoCronograma"
        [p-striped]="true">
      </po-table>

      <p *ngIf="!carregandoCronograma && cronogramaCarregado && cronograma.length === 0">
        Sem cronograma financeiro.
      </p>

      <p *ngIf="!carregandoCronograma && !cronogramaCarregado && planilhasSelecionadas.length === 0">
        Marque ao menos uma planilha acima para ver o cronograma financeiro.
      </p>
    </div>
  </div>
</po-page-list>

<!-- position: fixed -- ver nota em styles.css / importar-medicao.component (mesmo padrao,
     rodape sempre visivel sem depender do scroll da area de conteudo do po-page-list). -->
<div class="rtm002-footer">
  <po-button p-label="Cancelar" p-kind="secondary" [p-disabled]="exportando" (p-click)="cancelar()"></po-button>
  <po-button
    p-label="Exportar"
    p-kind="primary"
    [p-icon]="iconDownload"
    [p-loading]="exportando"
    [p-disabled]="!contratoCarregado || planilhas.length === 0 || exportando"
    (p-click)="exportar()">
  </po-button>
</div>
