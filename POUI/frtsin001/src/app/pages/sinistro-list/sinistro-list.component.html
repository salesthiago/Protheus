<po-page-list p-title="Sinistros de Frota" [p-filter]="filtroPagina">
  <div class="frtsin-header-acoes">
    <po-button p-label="Incluir" p-kind="primary" p-icon="po-icon-plus" (p-click)="novo()"></po-button>
    <po-button p-label="Importar Planilha" p-icon="po-icon-upload" (p-click)="importar()"></po-button>
    <po-button p-label="Configuração" p-icon="po-icon-settings" (p-click)="configuracao()"></po-button>
  </div>

  <po-table
    [p-columns]="colunas"
    [p-items]="sinistros"
    [p-loading]="carregando"
    [p-striped]="true"
    [p-sort]="true"
    [p-selectable]="true"
    (p-selected)="abrir($event)">
  </po-table>
</po-page-list>

<po-modal #modalBuscaAvancada p-title="Busca Avançada" p-size="md">
  <div class="po-row">
    <po-input class="po-md-6" p-label="Placa / Série" name="fPlaca" [(ngModel)]="filtroPlaca"></po-input>
    <po-select
      class="po-md-6"
      p-label="Evento"
      [p-options]="eventoOptions"
      name="fEvento"
      [ngModel]="filtroEvento"
      (ngModelChange)="filtroEvento = $event">
    </po-select>
  </div>
  <div class="po-row">
    <po-select
      class="po-md-6"
      p-label="Culpabilidade"
      [p-options]="culpaOptions"
      name="fCulpa"
      [ngModel]="filtroCulpa"
      (ngModelChange)="filtroCulpa = $event">
    </po-select>
    <po-select
      class="po-md-6"
      p-label="Status"
      [p-options]="statusOptions"
      name="fStatus"
      [ngModel]="filtroStatus"
      (ngModelChange)="filtroStatus = $event">
    </po-select>
  </div>
  <div class="po-row">
    <po-datepicker class="po-md-6" p-label="Data do Sinistro (de)" name="fDe" [(ngModel)]="filtroDataDe"></po-datepicker>
    <po-datepicker class="po-md-6" p-label="Data do Sinistro (até)" name="fAte" [(ngModel)]="filtroDataAte"></po-datepicker>
  </div>

  <div class="frtsin-modal-acoes">
    <po-button p-label="Limpar" p-kind="secondary" (p-click)="limparBuscaAvancada()"></po-button>
    <po-button p-label="Aplicar" p-kind="primary" (p-click)="aplicarBuscaAvancada()"></po-button>
  </div>
</po-modal>
